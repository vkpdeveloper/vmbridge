# Builds VM Bridge for macOS and Linux and attaches the files to a GitHub release.
# install.sh downloads from the latest release and checks it against SHA256SUMS.
#
# Every merge to main is released: once checks pass, the patch version in
# package.json goes up by one (1.1.14 -> 1.1.15), a "chore: release X.Y.Z"
# commit and a vX.Y.Z tag are pushed to main, and that tag is built and published
# in this same run. Pushing a v* tag by hand still releases that tag as is.
#
# Repository setup:
# - Secret VMBRIDGE_BOAT_CLIENT_ID: baked into release builds (may be empty).
# - Branch protection on main must let GitHub Actions push (add it to the
#   bypass list), or the release commit is rejected.
name: Release

on:
  push:
    branches: [main]
    tags: ["v*"]

# Jobs that run package code (install, tests, build) only get a read token.
permissions:
  contents: read

# One release at a time. A merge that lands while a release runs waits for it.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # A release must pass the same checks as CI before anything is built or published.
  # Release commits are skipped so they don't release again (pushes made with the
  # Actions token don't start workflows anyway).
  check:
    if: >-
      github.ref_type == 'tag' ||
      (github.actor != 'github-actions[bot]' &&
      !startsWith(github.event.head_commit.message, 'chore: release '))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run check

  # Bumps the version and pushes the release commit and tag. It has write access,
  # so it only runs git, jq and sed, never package code. If main moved since this
  # run started, the push is rejected and the newer merge's run releases instead.
  version:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - if: github.ref_type == 'branch'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: tag
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          old=$(jq -r .version package.json)
          IFS=. read -r major minor patch <<< "$old"
          new="$major.$minor.$((patch + 1))"
          old_re=${old//./\\.}
          sed -i "s/\"version\": \"$old_re\"/\"version\": \"$new\"/" package.json
          # The landing page shows the current version in its terminal demos.
          sed -i -e "s/VM Bridge $old_re /VM Bridge $new /g" -e "s/const version = \"$old_re\"/const version = \"$new\"/" \
            apps/landing/components/Stage.tsx apps/landing/components/Terminal.tsx apps/landing/lib/data.ts
          test "$(jq -r .version package.json)" = "$new"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore: release $new"
          git tag "v$new"
          git push --atomic origin HEAD:refs/heads/main "refs/tags/v$new"
          echo "tag=v$new" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    strategy:
      matrix:
        include:
          # macOS builds run on macOS so the binaries get signed.
          - { os: macos-latest, target: bun-darwin-arm64 }
          - { os: macos-latest, target: bun-darwin-x64 }
          - { os: ubuntu-latest, target: bun-linux-x64 }
          - { os: ubuntu-latest, target: bun-linux-arm64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ needs.version.outputs.tag }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run compile ${{ matrix.target }}
        env:
          VMBRIDGE_BOAT_CLIENT_ID: ${{ secrets.VMBRIDGE_BOAT_CLIENT_ID }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.target }}
          path: dist/vmbridge-*

  # The only job with write access to releases. It never checks out the repo or
  # runs package code: it downloads the built files, signs their provenance and
  # publishes them.
  release:
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Write SHA256SUMS
        working-directory: dist
        run: |
          sha256sum vmbridge-* > SHA256SUMS
          cat SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - run: gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --title "$TAG" --generate-notes
        env:
          TAG: ${{ needs.version.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
