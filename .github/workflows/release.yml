# Builds VM Bridge for macOS and Linux and attaches the files to a GitHub release.
# Push a tag like v0.1.0 to publish. install.sh downloads from the latest release
# and checks it against SHA256SUMS.
name: Release

on:
  push:
    tags: ["v*"]

# Jobs that run package code (install, tests, build) only get a read token.
permissions:
  contents: read

jobs:
  # A tag must pass the same checks as CI before anything is built or published.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run check

  build:
    needs: check
    strategy:
      matrix:
        include:
          # macOS builds run on macOS so the binaries get signed.
          - { os: macos-latest, target: bun-darwin-arm64 }
          - { os: macos-latest, target: bun-darwin-x64 }
          - { os: ubuntu-latest, target: bun-linux-x64 }
          - { os: ubuntu-latest, target: bun-linux-arm64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run compile ${{ matrix.target }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.target }}
          path: dist/vmbridge-*

  # The only job with write access. It never checks out the repo or runs package
  # code: it downloads the built files, signs their provenance and publishes them.
  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Write SHA256SUMS
        working-directory: dist
        run: |
          sha256sum vmbridge-* > SHA256SUMS
          cat SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
